<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Study Hood</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav><div class="wrap"><a class="brand" href="/">Study Hood</a></div></nav>
<div class="wrap-narrow">
  <div class="card">
    <h2>Application form</h2>
    <p class="card-sub">Fields marked * are required. This takes about 3 minutes.</p>

    {% if errors %}
    <div class="error-box">
      <strong>Please fix the following:</strong>
      <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    </div>
    {% endif %}

    <form method="post" action="/apply">
      <label for="full_name">Full name *</label>
      <input type="text" id="full_name" name="full_name" required value="{{ data.full_name or '' }}">

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required value="{{ data.email or '' }}">

      <label for="phone">Phone (10 digits) *</label>
      <input type="tel" id="phone" name="phone" required value="{{ data.phone or '' }}">

      <label for="city">City *</label>
      <input type="text" id="city" name="city" required value="{{ data.city or '' }}">

      <label for="course_interested">Course interested in *</label>
      <input type="text" id="course_interested" name="course_interested" required
             placeholder="e.g. B.Tech Computer Science" value="{{ data.course_interested or '' }}">

      <label for="preferred_college">Preferred college(s) *</label>
      <input type="text" id="preferred_college" name="preferred_college" required
             placeholder="e.g. XYZ College, ABC University" value="{{ data.preferred_college or '' }}">

      <label for="intake_year">Preferred intake year</label>
      <select id="intake_year" name="intake_year">
        <option value="" {% if not data.intake_year %}selected{% endif %}>Select year</option>
        <option value="2026" {% if data.intake_year == "2026" %}selected{% endif %}>2026</option>
        <option value="2027" {% if data.intake_year == "2027" %}selected{% endif %}>2027</option>
        <option value="2028" {% if data.intake_year == "2028" %}selected{% endif %}>2028</option>
      </select>

      <label for="twelfth_percentage">12th grade percentage</label>
      <input type="text" id="twelfth_percentage" name="twelfth_percentage" value="{{ data.twelfth_percentage or '' }}">

      <label for="message">Anything else we should know?</label>
      <textarea id="message" name="message" rows="3">{{ data.message or '' }}</textarea>

      <div class="consent-row">
        <input type="checkbox" id="consent" name="consent" value="yes">
        <label for="consent">I agree that Study Hood can store and use my information to process my college application and contact me about it.</label>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn" type="submit">Submit application</button>
      </div>
    </form>
  </div>
</div>
<footer>
  <div class="wrap">
    <p class="footer-note">Study Hood &middot; Your data is used only to process your college application.</p>
  </div>
</footer>
</body>
</html>
